<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%" aria-label="Minh họa Bát phở Hà Nội truyền thống CookMate" role="img">
  <defs>
    <!-- Warm amber glow filter -->
    <filter id="phoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Warm terracotta radial gradient for broth surface -->
    <radialGradient id="brothGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FF9E66" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#C2410C" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#7C2D12" stop-opacity="0.95" />
    </radialGradient>

    <!-- Chopsticks wooden gradient -->
    <linearGradient id="chopstickWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Porcelain bowl gradient -->
    <linearGradient id="bowlCeramic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="60%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Table shadow -->
  <ellipse cx="120" cy="162" rx="72" ry="9" fill="rgba(0,0,0,0.35)" />

  <!-- Steam lines (Gentle rising wisps) -->
  <g class="pho-art-steam" stroke="rgba(254, 215, 170, 0.75)" stroke-width="2.2" fill="none" stroke-linecap="round">
    <path d="M 95 62 Q 88 42, 98 24 T 92 8" opacity="0.7" />
    <path d="M 120 56 Q 130 36, 118 18 T 126 4" opacity="0.9" stroke="rgba(253, 230, 138, 0.9)" stroke-width="2.6" />
    <path d="M 145 62 Q 154 44, 142 26 T 150 9" opacity="0.7" />
  </g>

  <!-- Deep Ceramic Bowl Base -->
  <ellipse cx="120" cy="155" rx="36" ry="6" fill="#1E293B" stroke="#E85D2A" stroke-width="1.8" />

  <!-- Bowl Outer Body -->
  <path d="M 38 78 C 42 124, 76 155, 120 155 C 164 155, 198 124, 202 78 Z"
        fill="url(#bowlCeramic)"
        stroke="#E85D2A"
        stroke-width="2.4" />

  <!-- Traditional Decorative Motif on Bowl Body -->
  <path d="M 68 116 Q 120 136, 172 116" stroke="rgba(253, 186, 116, 0.55)" stroke-width="1.6" fill="none" stroke-dasharray="4 3" />
  <circle cx="120" cy="126" r="3" fill="#E85D2A" />
  <circle cx="100" cy="123" r="2" fill="#FDBA74" />
  <circle cx="140" cy="123" r="2" fill="#FDBA74" />

  <!-- Inner Broth Surface (Top Ellipse) -->
  <ellipse cx="120" cy="78" rx="80" ry="24" fill="url(#brothGrad)" stroke="#FED7AA" stroke-width="2.2" />

  <!-- Broth Shimmer & Golden Oil Droplets -->
  <ellipse cx="120" cy="78" rx="68" ry="18" fill="none" stroke="rgba(254, 240, 138, 0.35)" stroke-width="1.2" />
  <circle cx="82" cy="76" r="2.5" fill="#FEF08A" opacity="0.75" />
  <circle cx="158" cy="80" r="2" fill="#FEF08A" opacity="0.7" />
  <circle cx="138" cy="86" r="2.5" fill="#FEF08A" opacity="0.8" />

  <!-- Silky Rice Noodle Strands in Broth -->
  <g stroke="#FFFDF5" stroke-width="3.2" fill="none" stroke-linecap="round">
    <path d="M 66 76 Q 95 90, 132 82 T 174 74" />
    <path d="M 74 84 Q 108 96, 146 86 T 168 82" stroke="#FED7AA" stroke-width="2.8" />
    <path d="M 88 88 Q 122 98, 154 88" stroke="#FEF3C7" stroke-width="2.4" />
  </g>

  <!-- Tender Beef Slices (Tái lăn / chín) -->
  <g fill="#991B1B" stroke="#7F1D1D" stroke-width="1">
    <path d="M 78 72 C 72 65, 96 61, 108 67 C 114 70, 112 77, 102 79 C 90 81, 80 77, 78 72 Z" fill="#B91C1C" />
    <path d="M 134 68 C 128 62, 152 58, 164 64 C 170 67, 166 74, 156 76 C 146 78, 136 74, 134 68 Z" fill="#991B1B" />
  </g>

  <!-- Fresh Herbs, Scallion Rings & Star Anise -->
  <!-- Scallion rings (Hành hoa chẻ) -->
  <ellipse cx="118" cy="74" rx="8" ry="3.5" fill="none" stroke="#86EFAC" stroke-width="2" />
  <ellipse cx="132" cy="78" rx="6" ry="3" fill="none" stroke="#4ADE80" stroke-width="1.8" />
  <circle cx="98" cy="74" r="3" fill="#22C55E" />
  <circle cx="148" cy="76" r="2.5" fill="#16A34A" />

  <!-- Fresh Lime Wedge (Lát chanh tươi) -->
  <g transform="translate(56, 60) rotate(-15)">
    <path d="M 0 0 A 10 10 0 0 1 18 6 Z" fill="#84CC16" stroke="#4D7C0F" stroke-width="1" />
    <path d="M 2 2 A 8 8 0 0 1 16 6 Z" fill="#BEF264" opacity="0.8" />
  </g>

  <!-- Star Anise (Hoa hồi thơm) -->
  <g transform="translate(170, 68)" fill="#78350F" stroke="#451A03" stroke-width="0.8">
    <circle cx="0" cy="0" r="3" />
    <ellipse cx="0" cy="-6" rx="2" ry="4" />
    <ellipse cx="5" cy="-2" rx="4" ry="2" />
    <ellipse cx="4" cy="4" rx="3.5" ry="2" />
    <ellipse cx="-4" cy="4" rx="3.5" ry="2" />
    <ellipse cx="-5" cy="-2" rx="4" ry="2" />
  </g>

  <!-- Lifted Noodles draped over chopsticks -->
  <g stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.4))">
    <path d="M 104 82 Q 112 50, 122 42 Q 128 40, 132 50 Q 138 66, 142 82" />
    <path d="M 110 84 Q 116 54, 124 45 Q 128 42, 134 52 Q 140 70, 146 84" stroke="#FFFBEB" stroke-width="3" />
  </g>

  <!-- Elegant Wooden Chopsticks -->
  <g class="pho-art-chopsticks" filter="drop-shadow(0 3px 5px rgba(0,0,0,0.5))">
    <!-- Back Chopstick -->
    <path d="M 112 48 L 218 8 C 220 7, 222 9, 220 11 L 118 53 C 116 54, 111 50, 112 48 Z" fill="url(#chopstickWood)" />
    <!-- Front Chopstick -->
    <path d="M 115 54 L 222 14 C 224 13, 226 15, 224 17 L 121 59 C 119 60, 114 56, 115 54 Z" fill="url(#chopstickWood)" />
    <!-- Chopstick Golden Bands -->
    <path d="M 210 12 L 216 10 L 218 13 L 212 15 Z" fill="#FDE047" />
    <path d="M 214 18 L 220 16 L 222 19 L 216 21 Z" fill="#FDE047" />
  </g>

  <!-- Bowl Rim Highlight (Final accent for sharpness) -->
  <ellipse cx="120" cy="78" rx="81" ry="24" fill="none" stroke="#FFEDD5" stroke-width="1.8" opacity="0.9" />
</svg>
