<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="50%" stop-color="#FFEDD5"/>
      <stop offset="100%" stop-color="#FED7AA"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E85D2A"/>
      <stop offset="100%" stop-color="#C74E22"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#E85D2A" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  
  <!-- Subtle culinary pattern circles -->
  <circle cx="50" cy="50" r="120" fill="#EA580C" fill-opacity="0.04"/>
  <circle cx="550" cy="350" r="150" fill="#EA580C" fill-opacity="0.04"/>
  
  <!-- Central Badge -->
  <g filter="url(#shadow)">
    <circle cx="300" cy="170" r="54" fill="#FFFFFF"/>
    <circle cx="300" cy="170" r="46" fill="url(#iconGrad)"/>
    <!-- Chef Hat / Cloche Icon -->
    <path d="M285 185H315C316.5 185 318 183.5 318 182C318 174 312 167 304 165.5C307 162.5 308.5 158 307.5 153.5C305.5 146 298.5 142 291 144C286.5 145 283 148.5 281.5 153C277 155 274 159.5 274 165C274 173 280 180 285 182V185Z" fill="#FFFFFF"/>
    <rect x="282" y="188" width="36" height="4" rx="2" fill="#FFFFFF"/>
  </g>
  
  <!-- Text Label -->
  <text x="300" y="260" text-anchor="middle" font-family="'Be Vietnam Pro', -apple-system, sans-serif" font-size="20" font-weight="700" fill="#292524">
    Ảnh món ăn CookMate
  </text>
  <text x="300" y="288" text-anchor="middle" font-family="'Be Vietnam Pro', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#78716C">
    Chuẩn định lượng • Trọn dinh dưỡng
  </text>
</svg>
