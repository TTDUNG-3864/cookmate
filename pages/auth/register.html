<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký | CookMate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/pages.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
  <link rel="stylesheet" href="../../assets/css/auth.css">
</head>
<body>

  <div class="cookmate-auth">
    <div class="cookmate-auth__bg-pattern" aria-hidden="true"></div>

    <!-- Navigation Header (Cao 60px, căn lề max-width 1120px đồng bộ khối chính) -->
    <div class="cookmate-auth__nav-wrap">
      <header class="cookmate-auth__nav">
        <a href="../../index.html" class="cookmate-auth__brand" aria-label="CookMate Trang chủ">
          <div class="cookmate-auth__brand-icon">
            <i class="fa-solid fa-utensils"></i>
          </div>
          <span class="cookmate-auth__brand-name">Cook<span class="cookmate-auth__brand-accent">Mate</span></span>
        </a>

        <a href="../../index.html" class="cookmate-auth__back-home">
          <i class="fa-solid fa-arrow-left"></i>
          <span>Về trang chủ</span>
        </a>
      </header>
    </div>

    <!-- Main Auth Area -->
    <main class="cookmate-auth__main">
      <div class="cookmate-auth__layout">

        <!-- =========================================================
             BÁT PHỞ HÀ NỘI SÂU LÒNG & ĐÔI ĐŨA GẮP PHỞ (V2)
             ========================================================= -->
        <div class="pho-stage" id="phoStage" role="button" tabindex="0"
             aria-label="Chạm vào đôi đũa để khám phá hiệu ứng gắp phở Hà Nội">
          <div class="pho-svg-wrapper">
            <svg class="pho-svg" viewBox="0 0 460 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Minh họa Bát phở Hà Nội sâu lòng in chữ sắc nét bốc khói nghi ngút">
              <defs>
                <!-- Glow Radial Gradient -->
                <radialGradient id="phoGlowGrad" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="#FF9E66" stop-opacity="0.45" />
                  <stop offset="55%" stop-color="#FFD6A5" stop-opacity="0.2" />
                  <stop offset="100%" stop-color="#FFF9F2" stop-opacity="0" />
                </radialGradient>

                <!-- Bowl Porcelain Shading (Deep Bowl Profile) -->
                <linearGradient id="bowlShading" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#FFFFFF" />
                  <stop offset="35%" stop-color="#FAF7F2" />
                  <stop offset="75%" stop-color="#EDE5D8" />
                  <stop offset="100%" stop-color="#D8CCBB" />
                </linearGradient>

                <!-- Broth Gradient -->
                <radialGradient id="brothGrad" cx="50%" cy="45%" r="52%">
                  <stop offset="0%" stop-color="#C8752D" />
                  <stop offset="45%" stop-color="#A5541B" />
                  <stop offset="85%" stop-color="#7A390E" />
                  <stop offset="100%" stop-color="#552407" />
                </radialGradient>

                <!-- Chopstick Wood Gradients -->
                <linearGradient id="chopstickGrad" x1="0%" y1="100%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#6F3F1B" />
                  <stop offset="40%" stop-color="#935728" />
                  <stop offset="85%" stop-color="#542B0F" />
                  <stop offset="100%" stop-color="#D4AF37" />
                </linearGradient>

                <!-- Beef Gradient -->
                <linearGradient id="beefGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#9C3A28" />
                  <stop offset="60%" stop-color="#7B291A" />
                  <stop offset="100%" stop-color="#581B10" />
                </linearGradient>

                <!-- Filters -->
                <filter id="steamBlur" x="-30%" y="-30%" width="160%" height="160%">
                  <feGaussianBlur stdDeviation="2.5" />
                </filter>
                <filter id="shadowBlur" x="-20%" y="-20%" width="140%" height="140%">
                  <feGaussianBlur stdDeviation="6" />
                </filter>
              </defs>

              <!-- 1. Ambient Warm Glow -->
              <circle class="pho-ambient-glow" cx="230" cy="205" r="165" fill="url(#phoGlowGrad)" />

              <!-- 2. Soft Table Shadow Under Deep Bowl Base -->
              <ellipse cx="230" cy="308" rx="135" ry="18" fill="rgba(80, 40, 15, 0.12)" filter="url(#shadowBlur)" />

              <!-- 3. Base Ring / Chân đế sứ vững chãi -->
              <path d="M 166 288 C 166 306, 294 306, 294 288 L 290 274 L 170 274 Z" fill="#EAE4DC" stroke="#CEC4B5" stroke-width="1.5" />

              <!-- 4. Deep Porcelain Bowl Body (Thành bát sâu lòng, vuốt mượt mà về đáy) -->
              <path d="M 75 145 C 75 240, 152 290, 230 290 C 308 290, 385 240, 385 145 C 385 110, 75 110, 75 145 Z" fill="url(#bowlShading)" stroke="#D4C9BA" stroke-width="2" />

              <!-- 5. Blue Porcelain Oriental Pattern on Upper Rim -->
              <path d="M 88 152 Q 120 163, 155 168 Q 192 173, 230 173 Q 268 173, 305 168 Q 340 163, 372 152" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="6,4" opacity="0.65" />
              <circle cx="155" cy="168" r="2.5" fill="#1D4ED8" opacity="0.75" />
              <circle cx="230" cy="173" r="3" fill="#1D4ED8" opacity="0.75" />
              <circle cx="305" cy="168" r="2.5" fill="#1D4ED8" opacity="0.75" />

              <!-- 6. IN DÒNG CHỮ "PHỞ HÀ NỘI" LÊN MẶT TRƯỚC BÁT (Chính xác yêu cầu Lỗi 2) -->
              <g class="pho-brand-text" opacity="0.95">
                <path d="M 132 238 Q 150 234, 164 238" stroke="#9A3412" stroke-width="1.5" fill="none" opacity="0.75" />
                <circle cx="128" cy="238" r="2" fill="#9A3412" />
                <path d="M 296 238 Q 310 234, 328 238" stroke="#9A3412" stroke-width="1.5" fill="none" opacity="0.75" />
                <circle cx="332" cy="238" r="2" fill="#9A3412" />
                <text x="230" y="243" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-weight="800" font-size="14" letter-spacing="3.5" fill="#9A3412">PHỞ HÀ NỘI</text>
              </g>

              <!-- 7. Bowl Ceramic Rim (Viền miệng bát có chiều sâu 3D) -->
              <ellipse cx="230" cy="142" rx="155" ry="40" fill="#FCFAF7" stroke="#DBD2C3" stroke-width="3" />

              <!-- 8. Lòng bát & Nước dùng phở bò (Amber Broth) -->
              <ellipse cx="230" cy="145" rx="142" ry="34" fill="url(#brothGrad)" />

              <!-- 9. Glistening Broth Shimmer & Golden Oil Droplets -->
              <ellipse cx="195" cy="138" rx="40" ry="10" fill="rgba(255, 235, 180, 0.18)" />
              <circle cx="168" cy="135" r="4.5" fill="#FDE047" opacity="0.5" />
              <circle cx="280" cy="146" r="3.5" fill="#FBBF24" opacity="0.45" />
              <circle cx="215" cy="158" r="5" fill="#F59E0B" opacity="0.4" />
              <circle cx="260" cy="134" r="3" fill="#FEF08A" opacity="0.55" />

              <!-- 10. Pho Noodles in Broth (Swirling ribbons) -->
              <g stroke-linecap="round" fill="none">
                <path d="M 135 142 Q 168 165, 210 156 T 275 160 Q 310 155, 325 144" stroke="#FFFDF8" stroke-width="6.5" />
                <path d="M 148 152 Q 182 172, 232 165 T 310 150" stroke="#F5ECE0" stroke-width="6" />
                <path d="M 172 144 Q 202 164, 248 158 T 292 147" stroke="#FFFFFF" stroke-width="5.5" />
              </g>

              <!-- 11. Thinly Sliced Beef (Thịt bò chín/tái mềm ngon) -->
              <g class="pho-beef">
                <path d="M 152 138 C 147 126, 180 120, 204 130 C 218 136, 212 150, 194 154 C 174 158, 156 150, 152 138 Z" fill="url(#beefGrad)" stroke="#581B10" stroke-width="1.2" />
                <path d="M 162 134 Q 185 130, 199 138" stroke="#E07A6B" stroke-width="1.4" fill="none" opacity="0.8" />
                <path d="M 235 132 C 230 122, 268 118, 290 128 C 302 134, 298 146, 278 150 C 258 153, 240 146, 235 132 Z" fill="url(#beefGrad)" stroke="#581B10" stroke-width="1.2" />
                <path d="M 245 128 Q 268 126, 284 135" stroke="#E07A6B" stroke-width="1.4" fill="none" opacity="0.8" />
              </g>

              <!-- 12. Fresh Scallions & Herbs (Hành lá, hành tây, ngò gai, ớt tươi) -->
              <g class="pho-herbs">
                <ellipse cx="215" cy="135" rx="14" ry="6" fill="none" stroke="#FFFFFF" stroke-width="2.2" opacity="0.9" />
                <ellipse cx="255" cy="142" rx="12" ry="5" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.85" />
                <ellipse cx="140" cy="140" rx="5" ry="3" fill="#2E7D4F" />
                <ellipse cx="178" cy="154" rx="4.5" ry="2.5" fill="#16A34A" />
                <ellipse cx="195" cy="138" rx="5" ry="3" fill="#22C55E" />
                <ellipse cx="230" cy="150" rx="5.5" ry="3" fill="#15803D" />
                <ellipse cx="270" cy="138" rx="4" ry="2.5" fill="#2E7D4F" />
                <ellipse cx="295" cy="152" rx="5" ry="3" fill="#16A34A" />
                <ellipse cx="205" cy="146" rx="6.5" ry="3.5" fill="#DC2626" stroke="#FEF08A" stroke-width="1.4" />
              </g>

              <!-- 13. Hot Steam Wisps -->
              <g class="pho-steam" filter="url(#steamBlur)">
                <path class="pho-steam-path steam-1" d="M 180 125 Q 165 85, 190 45 T 175 5" stroke="rgba(255,255,255,0.7)" stroke-width="5" fill="none" stroke-linecap="round" />
                <path class="pho-steam-path steam-2" d="M 230 120 Q 250 78, 225 35 T 245 2" stroke="rgba(255,255,255,0.8)" stroke-width="6" fill="none" stroke-linecap="round" />
                <path class="pho-steam-path steam-3" d="M 285 125 Q 305 85, 280 45 T 290 8" stroke="rgba(255,255,255,0.7)" stroke-width="5" fill="none" stroke-linecap="round" />
              </g>

              <!-- 14. LIFTED NOODLES (ĐỈNH SỢI PHỞ GẮN CHẶT CHÍNH XÁC VÀO ĐẦU GẮP ĐÔI ĐŨA - Lỗi 3) -->
              <g class="pho-lifted-noodles" id="liftedNoodles">
                <path d="M 168 152 C 172 120, 184 96, 198 88 C 204 84, 210 88, 212 100 C 216 118, 222 142, 226 155" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" filter="drop-shadow(0 2px 4px rgba(100, 50, 10, 0.18))" />
                <path d="M 178 155 C 182 125, 190 94, 202 84 C 208 80, 216 85, 218 98 C 224 122, 230 145, 235 158" fill="none" stroke="#FFFDF8" stroke-width="6" stroke-linecap="round" filter="drop-shadow(0 2px 4px rgba(100, 50, 10, 0.15))" />
                <path d="M 188 158 C 190 132, 196 102, 204 86 C 208 82, 214 86, 216 98 C 220 120, 224 146, 228 160" fill="none" stroke="#F5ECE0" stroke-width="5" stroke-linecap="round" />
                <path d="M 198 160 C 200 138, 204 105, 208 90 C 212 87, 218 92, 222 105 C 226 128, 234 150, 238 162" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />

                <!-- Vết hành hoa nhỏ dính vào sợi phở -->
                <ellipse cx="190" cy="118" rx="3.5" ry="2" fill="#16A34A" />
                <!-- Giọt nước dùng vàng óng nhỏ giọt -->
                <circle class="noodle-drop" cx="206" cy="115" r="3" fill="#F59E0B" />
              </g>

              <!-- 15. ĐÔI ĐŨA (CHOPSTICKS) - CẮM XIÊN TỰ NHIÊN, KHÔNG CÓ SỢI PHỞ LƠ LỬNG KHI NẰM YÊN -->
              <g class="pho-chopsticks" id="phoChopsticks">
                <!-- Rear Chopstick (Đũa sau) -->
                <path d="M 206 152 L 388 28 C 390 26, 393 28, 391 31 L 213 158 C 211 159, 205 155, 206 152 Z" fill="url(#chopstickGrad)" filter="drop-shadow(0 3px 5px rgba(0,0,0,0.25))" />
                <path d="M 374 38 L 383 31 L 386 35 L 377 42 Z" fill="#EAB308" />

                <!-- Front Chopstick (Đũa trước) -->
                <path d="M 194 158 L 376 34 C 378 32, 381 34, 379 37 L 201 164 C 199 165, 193 161, 194 158 Z" fill="url(#chopstickGrad)" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.3))" />
                <path d="M 362 44 L 371 37 L 374 41 L 365 48 Z" fill="#FACC15" />
              </g>

            </svg>
          </div>

          <!-- Interaction Hint CTA -->
          <div class="pho-cta-pill" id="phoCta">
            <i class="fa-solid fa-hand-pointer"></i>
            <span>Chạm vào đôi đũa để khám phá CookMate</span>
          </div>
        </div>

        <!-- =========================================================
             FORM ĐĂNG KÝ DUY NHẤT (LOẠI BỎ HOÀN TOÀN TAB - Lỗi 4)
             ========================================================= -->
        <div class="cookmate-auth__card-wrapper" id="authCardWrapper">
          <div class="cookmate-auth__card-inner">

            <h1 class="auth-title">Tạo tài khoản CookMate</h1>
            <p class="auth-subtitle">Gia nhập cộng đồng yêu bếp và khám phá hàng ngàn công thức chuẩn định lượng.</p>

            <form id="registerForm" novalidate>
              <div class="auth-field">
                <label for="regName" class="auth-label">
                  <span><i class="fa-regular fa-user"></i> Họ và tên</span>
                </label>
                <div class="auth-input-wrap">
                  <i class="fa-regular fa-user auth-field-icon"></i>
                  <input type="text" id="regName" class="auth-input" placeholder="Ví dụ: Nguyễn Văn An" autocomplete="name" required>
                </div>
                <div class="auth-error-msg" id="regNameError"></div>
              </div>

              <div class="auth-field">
                <label for="regEmail" class="auth-label">
                  <span><i class="fa-regular fa-envelope"></i> Email</span>
                </label>
                <div class="auth-input-wrap">
                  <i class="fa-regular fa-envelope auth-field-icon"></i>
                  <input type="email" id="regEmail" class="auth-input" placeholder="name@example.com" autocomplete="email" required>
                </div>
                <div class="auth-error-msg" id="regEmailError"></div>
              </div>

              <div class="auth-field">
                <label for="regPassword" class="auth-label">
                  <span><i class="fa-solid fa-lock"></i> Mật khẩu</span>
                </label>
                <div class="auth-input-wrap">
                  <i class="fa-solid fa-lock auth-field-icon"></i>
                  <input type="password" id="regPassword" class="auth-input" placeholder="Tối thiểu 6 ký tự" autocomplete="new-password" required>
                  <button type="button" class="password-toggle-btn" data-target="regPassword" aria-label="Hiện mật khẩu">
                    <i class="fa-regular fa-eye"></i>
                  </button>
                </div>
                <div class="auth-strength-wrap">
                  <div class="auth-strength-bars">
                    <div class="auth-strength-seg" id="seg1"></div>
                    <div class="auth-strength-seg" id="seg2"></div>
                    <div class="auth-strength-seg" id="seg3"></div>
                    <div class="auth-strength-seg" id="seg4"></div>
                  </div>
                  <div class="auth-strength-desc">
                    <span>Độ mạnh mật khẩu:</span>
                    <span class="auth-strength-label" id="strengthText">Tối thiểu 6 ký tự</span>
                  </div>
                </div>
                <div class="auth-error-msg" id="regPasswordError"></div>
              </div>

              <div class="auth-field">
                <label for="regConfirm" class="auth-label">
                  <span><i class="fa-solid fa-shield-halved"></i> Xác nhận mật khẩu</span>
                </label>
                <div class="auth-input-wrap">
                  <i class="fa-solid fa-shield-halved auth-field-icon"></i>
                  <input type="password" id="regConfirm" class="auth-input" placeholder="Nhập lại mật khẩu" autocomplete="new-password" required>
                  <button type="button" class="password-toggle-btn" data-target="regConfirm" aria-label="Hiện mật khẩu xác nhận">
                    <i class="fa-regular fa-eye"></i>
                  </button>
                </div>
                <div class="auth-error-msg" id="regConfirmError"></div>
              </div>

              <div class="auth-options">
                <label class="auth-checkbox-label">
                  <input type="checkbox" class="auth-checkbox" id="regTerms" checked>
                  <span style="font-size: 12px;">Tôi đồng ý với <a href="#" class="auth-link" onclick="if (typeof CookMateUI !== 'undefined') CookMateUI.showToast('Bạn đang sử dụng bản thử nghiệm CookMate Frontend!', 'info'); return false;">Điều khoản sử dụng</a> & <a href="#" class="auth-link" onclick="if (typeof CookMateUI !== 'undefined') CookMateUI.showToast('Thông tin của bạn được bảo mật trên trình duyệt!', 'info'); return false;">Chính sách riêng tư</a></span>
                </label>
              </div>

              <button type="submit" class="auth-action-btn" id="regSubmitBtn">
                <i class="fa-solid fa-user-plus"></i>
                <span>Tạo tài khoản</span>
              </button>
            </form>

            <!-- Tiếp tục với Google & Facebook (Lỗi 5) -->
            <div class="auth-divider">
              <span>Hoặc tiếp tục với</span>
            </div>

            <div class="auth-social-row">
              <button type="button" class="auth-social-btn" id="btnGoogleAuth">
                <svg class="auth-social-icon" width="18" height="18" viewBox="0 0 24 24">
                  <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                  <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/>
                  <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
                  <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                </svg>
                <span>Google</span>
              </button>
              <button type="button" class="auth-social-btn" id="btnFacebookAuth">
                <svg class="auth-social-icon" width="18" height="18" viewBox="0 0 24 24" fill="#1877F2">
                  <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                </svg>
                <span>Facebook</span>
              </button>
            </div>

            <p class="auth-switch-note">
              Đã có tài khoản? <a href="login.html" class="auth-link">Đăng nhập ngay</a>
            </p>

          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Shared App JS & Auth UI Scripts -->
  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/data/categories.js"></script>
  <script src="../../assets/js/data/ingredients.js"></script>
  <script src="../../assets/js/data/users.js"></script>
  <script src="../../assets/js/data/recipes.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/components.js"></script>
  <script src="../../assets/js/navigation.js"></script>
  <script src="../../assets/js/auth-ui.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      CookMateUI.initToast();
      CookMateAuthUI.init();
    });
  </script>
</body>
</html>
